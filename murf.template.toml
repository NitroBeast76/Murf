# =====================================================================
#  Murf Configuration
#  Delete this file to reset Murf to defaults.
# =====================================================================

[general]
version = 1
settle_delay_ms = 500
startup_delay_secs = 5
log_level = "info"

[palette]
source = "system"
mode = "smart"
scheme_type = "scheme-tonal-spot"
contrast = 0.0
ansi_mapping = "semantic"

# If the wallpaper is monochrome (greyscale), Matugen might extract a 
# muddy color (like olive). This fallback forces a specific accent color.
monochrome_fallback = "#808080"

# =====================================================================
#  Application Adapters
#  Set `enabled = false` to stop Murf from touching an app.
# =====================================================================

[apps.windows_terminal]
enabled = true

[apps.yasb]
enabled = true

[apps.glazewm]
enabled = true

[apps.chronoterm]
enabled = true

[apps.cava]
enabled = true

[apps.starship]
enabled = true

[apps.fastfetch]
enabled = true

[apps.windows_accent]
enabled = true

[apps.windows_theme]
enabled = false