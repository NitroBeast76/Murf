[package]
name = "murf"
version = "0.1.0"
edition = "2021"
description = "Wallpaper-driven theming for Windows apps."
license = "MIT"

[dependencies]
tray-icon = "0.19"
tao = "0.30"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
